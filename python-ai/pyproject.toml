[project]
name = "lha-python-ai"
version = "0.1.0"
description = "个人健康顾问助手 - Python AI 服务"
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.60,<2.0",
    "grpcio-tools>=1.60,<2.0",
    "langgraph>=0.2.0,<0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "pymilvus>=2.5.0,<2.6",
    "celery[redis]>=5.4,<6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "prometheus-client>=0.20,<1",
    "psutil>=6,<8",
    "psycopg[binary]>=3.1",
    "mcp>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.11",
]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.11",
    "datasets>=2.19",
    "llamafactory",
]
selfhost = [
    "paddleocr",
    "magic-pdf",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# 显式声明包发现：app 与 workers 两个顶层包，editable 安装不再报 flat-layout 冲突
[tool.setuptools.packages.find]
include = ["app*", "workers*"]
